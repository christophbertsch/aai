services:
  - type: web
    name: aai-cloud-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python aai_cloud_backend.py
    envVars:
      - key: QDRANT_URL
        value: http://34.40.104.64:6333
      - key: COLLECTION_NAME
        value: aai_comprehensive_automotive
      - key: MODEL_NAME
        value: all-MiniLM-L6-v2
      - key: PORT
        value: 10000
    plan: free